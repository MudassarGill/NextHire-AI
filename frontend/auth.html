<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign up or log in to NextHire AI and start practicing for your next interview.">
  <title>Login / Sign Up — NextHire AI</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="url(#g1)" stroke-width="2.5"/><path d="M10 16l4 4 8-8" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g1" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient></defs></svg>
        <span>NextHire AI</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="select-role.html">Start Interview</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- Auth Section -->
  <section class="auth-page">
    <div class="auth-container">
      <div class="glass-card auth-card">
        <a href="index.html" class="nav-logo" style="justify-content:center; margin-bottom:24px; font-size:1.5rem;">
          <svg viewBox="0 0 32 32" fill="none" width="36" height="36"><circle cx="16" cy="16" r="14" stroke="url(#g2)" stroke-width="2.5"/><path d="M10 16l4 4 8-8" stroke="url(#g2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g2" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient></defs></svg>
          <span>NextHire AI</span>
        </a>

        <!-- Tabs -->
        <div class="auth-tabs">
          <button class="auth-tab active" id="loginTab" onclick="switchTab('login')">Log In</button>
          <button class="auth-tab" id="signupTab" onclick="switchTab('signup')">Sign Up</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Email Address</label>
            <input type="email" id="loginEmail" class="form-input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="loginPassword">Password</label>
            <div class="password-wrapper">
              <input type="password" id="loginPassword" class="form-input" placeholder="Enter your password" required minlength="6">
              <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">👁️</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;" id="loginSubmit">
            Log In
          </button>
          <div class="auth-footer">
            Don't have an account? <a href="#" onclick="switchTab('signup'); return false;">Sign up</a>
          </div>
        </form>

        <!-- Signup Form -->
        <form id="signupForm" style="display:none;" onsubmit="handleSignup(event)">
          <div class="form-group">
            <label class="form-label" for="signupName">Full Name</label>
            <input type="text" id="signupName" class="form-input" placeholder="John Doe" required minlength="2">
          </div>
          <div class="form-group">
            <label class="form-label" for="signupEmail">Email Address</label>
            <input type="email" id="signupEmail" class="form-input" placeholder="you@example.com" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="signupPassword">Password</label>
            <div class="password-wrapper">
              <input type="password" id="signupPassword" class="form-input" placeholder="Min 6 characters" required minlength="6">
              <button type="button" class="password-toggle" onclick="togglePassword('signupPassword', this)">👁️</button>
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="signupConfirm">Confirm Password</label>
            <div class="password-wrapper">
              <input type="password" id="signupConfirm" class="form-input" placeholder="Re-enter password" required minlength="6">
              <button type="button" class="password-toggle" onclick="togglePassword('signupConfirm', this)">👁️</button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;" id="signupSubmit">
            Create Account
          </button>
          <div class="auth-footer">
            Already have an account? <a href="#" onclick="switchTab('login'); return false;">Log in</a>
          </div>
        </form>
      </div>
    </div>
  </section>

  <div class="toast-container" id="toastContainer"></div>

  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
