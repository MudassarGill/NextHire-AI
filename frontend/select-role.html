<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Choose your job role and start a mock interview session with AI.">
  <title>Select Role — NextHire AI</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'></text></svg>">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="container">
      <a href="index.html" class="nav-logo">
        <svg viewBox="0 0 32 32" fill="none"><circle cx="16" cy="16" r="14" stroke="url(#g1)" stroke-width="2.5"/><path d="M10 16l4 4 8-8" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><defs><linearGradient id="g1" x1="0" y1="0" x2="32" y2="32"><stop stop-color="#6C63FF"/><stop offset="1" stop-color="#00D9FF"/></linearGradient></defs></svg>
        <span>NextHire AI</span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Home</a></li>
        <li><a href="select-role.html" class="active">Start Interview</a></li>
        <li><a href="history.html">History</a></li>
        <li><a href="about.html">About</a></li>
      </ul>
      <div class="nav-user" id="navUser"></div>
      <button class="hamburger" id="hamburger" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main class="page-wrapper">
    <div class="container">
      <div class="page-header">
        <h1>Choose Your <span class="gradient-text">Job Role</span></h1>
        <p>Select a role, set difficulty, and start your AI mock interview</p>
      </div>

      <!-- Filters -->
      <div class="roles-filters">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="text" class="form-input" id="roleSearch" placeholder="Search roles...">
        </div>
        <button class="filter-chip active" data-filter="all">All</button>
        <button class="filter-chip" data-filter="engineering">Engineering</button>
        <button class="filter-chip" data-filter="data">Data & AI</button>
        <button class="filter-chip" data-filter="design">Design</button>
      </div>

      <!-- Roles Grid -->
      <div class="roles-grid" id="rolesGrid"></div>

      <!-- Config Panel -->
      <div class="config-panel glass-card" id="configPanel" style="display:none;">
        <div class="config-group">
          <label class="form-label">Selected Role</label>
          <div id="selectedRoleName" style="font-weight:700; font-size:1.1rem;"></div>
        </div>
        <div class="config-group">
          <label class="form-label" for="difficultySelect">Difficulty</label>
          <select id="difficultySelect" class="form-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>
        <div class="config-group">
          <label class="form-label" for="questionCount">Questions</label>
          <select id="questionCount" class="form-select">
            <option value="5">5 Questions</option>
            <option value="10" selected>10 Questions</option>
            <option value="15">15 Questions</option>
          </select>
        </div>
        <div class="config-group">
          <button class="btn btn-primary btn-lg" id="startInterviewBtn" onclick="startInterview()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
            Start Interview
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-content">
        <div class="footer-text">© 2026 NextHire AI</div>
        <div class="footer-links">
          <a href="about.html">About</a>
          <a href="index.html">Home</a>
        </div>
      </div>
    </div>
  </footer>

  <div class="toast-container" id="toastContainer"></div>
  <script src="js/app.js"></script>
  <script src="js/roles.js"></script>
</body>
</html>
