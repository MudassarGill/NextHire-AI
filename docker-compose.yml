services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nexthire_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - backend_data:/app/data
    restart: unless-stopped
    networks:
      - nexthire_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nexthire_frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - nexthire_network

networks:
  nexthire_network:
    driver: bridge

volumes:
  backend_data:
